<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf" content="{{ csrf_token }}">
  <title>{% block title %}Marketplace{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-page="{{ page }}" data-currency="{{ currency }}">
  <header class="nav">
    <a class="brand" href="{{ url_for('pages.explore') }}">Marketplace</a>
    <nav>
      <a href="{{ url_for('pages.explore') }}">Explore</a>
      {% if me %}
        <a href="{{ url_for('pages.sell') }}">Sell</a>
        <a href="{{ url_for('pages.orders') }}">My orders</a>
        <a href="#" id="logout">Log out ({{ me['name'].split()[0] }})</a>
      {% else %}
        <a href="{{ url_for('pages.login') }}">Log in</a>
        <a class="btn" href="{{ url_for('pages.signup') }}">Sign up</a>
      {% endif %}
    </nav>
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
