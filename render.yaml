services:
  - type: web
    name: marketplace
    runtime: docker
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: PAYMENT_PROVIDER
        value: mock          # change to paystack when ready
      - key: PAYSTACK_SECRET_KEY
        sync: false
